<!DOCTYPE html>
<html>
<head>
    <title>Category Hygiene</title>
    <style>
        :root {
            --bg-main: #2F2F2F;
            --bg-card: #3A3A3A;
            --border-default: #505050;
            --text-primary: #F2F2F2;
            --text-muted: #9A9A9A;
            --color-income: #3FB950;
            --color-budget: #58A6FF;
            --color-warning: #F2CC60;
        }
        body { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; padding: 32px; background: var(--bg-main); color: var(--text-primary); margin: 0; }
        h2 { font-size: 28px; margin: 0 0 8px 0; }
        .subtitle { color: var(--text-muted); font-size: 14px; margin: 0 0 32px 0; }
        .card { background: var(--bg-card); border: 1px solid var(--border-default); border-radius: 8px; padding: 16px; margin-bottom: 12px; }
        .card-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
        .card-left { display: flex; align-items: center; gap: 12px; }
        .badge { background: rgba(242,204,96,.15); color: var(--color-warning); border: 1px solid rgba(242,204,96,.3); border-radius: 4px; padding: 4px 10px; font-size: 14px; font-weight: 600; }
        .tx-count { color: var(--text-muted); font-size: 13px; }
        .card-actions { display: flex; align-items: center; gap: 8px; }
        select { padding: 8px; background: var(--bg-card); border: 1px solid var(--border-default); color: var(--text-primary); border-radius: 6px; font-size: 14px; min-width: 160px; }
        select:focus { outline: none; border-color: var(--color-budget); }
        button { padding: 8px 14px; cursor: pointer; background: var(--color-budget); color: #fff; border: none; border-radius: 6px; font-weight: 600; font-size: 14px; transition: background .2s; }
        button:hover { background: #6CB6FF; }
        button:disabled { background: #555; cursor: not-allowed; }
        a { color: var(--color-budget); text-decoration: none; }
        a:hover { text-decoration: underline; }
        .all-clean { color: var(--color-income); font-size: 16px; font-weight: 600; margin-top: 24px; }
        #orphan-list { margin-top: 24px; }
        .loading { color: var(--text-muted); font-size: 14px; margin-top: 24px; }
    </style>
</head>
<body>
    <h2>Category Hygiene</h2>
    <p class="subtitle">Transaction categories not tracked in any budget</p>
    <a href="/dashboard">&larr; Back to Dashboard</a>
    <div id="orphan-list"><p class="loading">Loading&hellip;</p></div>

    {% raw %}
    <script>
        function esc(s) {
            return String(s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function render(groups, knownCategories) {
            const list = document.getElementById('orphan-list');
            if (!groups.length) {
                list.innerHTML = '<p class="all-clean">&#10003; All categories are clean</p>';
                return;
            }
            const options = knownCategories.map(c =>
                `<option value="${esc(c)}">${esc(c)}</option>`
            ).join('');
            list.innerHTML = groups.map(g => `
                <div class="card orphan-card" data-category="${esc(g.category)}">
                    <div class="card-row">
                        <div class="card-left">
                            <span class="badge">${esc(g.category)}</span>
                            <span class="tx-count">${g.tx_count} transaction${g.tx_count !== 1 ? 's' : ''}</span>
                        </div>
                        <div class="card-actions">
                            <select class="new-cat-select">${options}</select>
                            <button onclick="reassign(this)">Reassign</button>
                        </div>
                    </div>
                </div>`
            ).join('');
        }

        async function reassign(btn) {
            const card = btn.closest('.orphan-card');
            const currentCategory = card.dataset.category;
            const newCategory = card.querySelector('.new-cat-select').value;
            const fd = new FormData();
            fd.append('current_category', currentCategory);
            fd.append('new_category', newCategory);
            btn.disabled = true;
            const res = await fetch('/hygiene/reclassify-group', { method: 'POST', body: fd });
            if (res.ok) {
                card.remove();
                if (!document.querySelector('.orphan-card')) {
                    document.getElementById('orphan-list').innerHTML =
                        '<p class="all-clean">&#10003; All categories are clean</p>';
                }
            } else {
                btn.disabled = false;
                alert('Reassignment failed.');
            }
        }

        fetch('/hygiene/groups')
            .then(r => r.json())
            .then(d => render(d.orphan_groups, d.known_categories));
    </script>
    {% endraw %}
</body>
</html>
